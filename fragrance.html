<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <title>BEAVIE Parfums</title>
    <meta name="description" content="A BEAVIE fragrance, and the place it was composed as." />
    <meta property="og:type" content="product" />
    <meta property="og:site_name" content="BEAVIE Parfums" />
    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icons/favicon.png" />
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/bodoni-moda.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jost.woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/three.module.min.js" } }
    </script>
    <script>document.documentElement.classList.add("js");</script>
  </head>
  <body class="page-world">
    <a class="skip-link" href="#story">Skip to the fragrance</a>
    <div class="page-veil" id="page-veil" aria-hidden="true"></div>

    <!-- The world: one WebGL canvas behind the page (stage.js + worlds/<scent>.js). -->
    <canvas class="stage" id="stage" aria-hidden="true"></canvas>
    <div class="world-still" id="world-still" aria-hidden="true"></div>

    <header class="site-header" id="site-header">
      <div class="nav-bar">
        <a class="brand" href="./" aria-label="BEAVIE Parfums, back to the collection">
          <img class="brand-bear" src="assets/icons/beavie-bear.webp" alt="" width="590" height="298" />
          <span class="wordmark" translate="no">BEAVIE</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="./#collection">Collection</a>
          <a href="./#heritage">Heritage</a>
          <a href="./#press">Principles</a>
        </nav>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
          <span></span><span></span>
        </button>
      </div>
    </header>

    <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu" hidden>
      <nav class="menu-main" aria-label="Sections">
        <a href="./#collection" style="--i: 0">Collection</a>
        <a href="./#heritage" style="--i: 1">Heritage</a>
        <a href="./#press" style="--i: 2">Principles</a>
      </nav>
      <div class="menu-scents" style="--i: 3">
        <p class="eyebrow">The eight scents</p>
        <ol data-scent-list></ol>
      </div>
    </div>

    <!-- Four acts, generated from the `scents` array by fragrance.js -->
    <main id="top" class="world"></main>

    <!-- Travel between worlds, and a way to hold the scene still -->
    <nav class="world-bar glass" id="world-bar" aria-label="Fragrances"></nav>

    <noscript>
      <p class="noscript">This page needs JavaScript to show the fragrance. <a href="./">Return to the collection.</a></p>
    </noscript>

    <script src="site.js"></script>
    <script src="fragrance.js"></script>
  </body>
</html>
